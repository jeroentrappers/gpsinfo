[versions]
# Build toolchain (root build.gradle.kts also references these explicitly).
# Kotlin 2.x + Compose Compiler plugin (replaces the old
# `composeOptions.kotlinCompilerExtensionVersion` knob).
agp = "9.2.1"
kotlin = "2.1.20"

# AndroidX — all on the latest stable as of the AGP 8.13 / Kotlin 2.1 / SDK 37
# toolchain. If lint flags a newer version it almost always means the
# toolchain itself needs another bump.
coreKtx = "1.18.0"
activityCompose = "1.13.0"
lifecycle = "2.10.0"
navigationCompose = "2.9.8"
datastorePreferences = "1.2.1"
coreSplashscreen = "1.2.0"
window = "1.5.1"
composeBom = "2026.05.00"
profileInstaller = "1.4.1"
benchmark = "1.5.0-alpha06"
baselineProfile = "1.5.0-alpha06"
espressoCore = "3.7.0"
osmdroid = "6.1.20"
# Android Auto — projection-mode templates. The library is OEM-neutral
# and doesn't require Google Play Services on the phone or the head
# unit; the system Android Auto app or compatible third-party host
# (e.g. an aftermarket head unit) is what connects.
carApp = "1.7.0"
# ZXing core — pure-Java QR encoder/decoder. Apache 2.0, no native
# dependencies, ~400 KB. We use only the encoder side for the
# "share my position" QR feature.
zxingCore = "3.5.3"

# Testing
junit = "4.13.2"
coroutinesTest = "1.11.0"
androidxTestCore = "1.7.0"
androidxTestRunner = "1.7.0"
androidxTestRules = "1.7.0"
androidxTestExtJunit = "1.3.0"
uiAutomator = "2.3.0"
screengrab = "2.1.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastorePreferences" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }
androidx-window = { module = "androidx.window:window", version.ref = "window" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileInstaller" }
osmdroid-android = { module = "org.osmdroid:osmdroid-android", version.ref = "osmdroid" }
androidx-car-app = { module = "androidx.car.app:app", version.ref = "carApp" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxingCore" }
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espressoCore" }

# Compose — versions resolved via the BOM, so no version.ref.
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-animation = { module = "androidx.compose.animation:animation" }

# Test
junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutinesTest" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidxTestRules" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiAutomator" }
fastlane-screengrab = { module = "tools.fastlane:screengrab", version.ref = "screengrab" }
