org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache. AGP 9 supports it; with this repo's two modules
# the savings on incremental builds are small but non-zero, and it
# catches accidental Project-mutation-at-execution-time bugs early.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# We pin compileSdk = 37 / targetSdk = 37 ahead of AGP 9.2.1's tested
# matrix (AGP 9.2 was QA'd against compileSdk 36). AGP emits a soft
# warning unless we suppress it. This is safe today because:
#   - we don't touch any SDK-37-only platform API
#   - the released app surface is exercised end-to-end by the screengrab
#     test on a current emulator before each release
# Revisit when AGP bumps its tested-compileSdk to 37+; then drop this.
android.suppressUnsupportedCompileSdk=37,37.0
