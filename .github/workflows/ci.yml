name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs when a newer push lands on the same ref. Saves
# minutes on PRs that get amended in quick succession.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Run JS actions on Node 24. The action majors below are already Node-24
# native; this also covers laggards that have no Node-24 release yet
# (e.g. android-actions/setup-android), silencing the Node-20 deprecation
# warning until those upstreams ship a Node-24 version.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Lint + unit tests + assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # JDK 21 matches gradle/gradle-daemon-jvm.properties (toolchainVersion=21).
      # Don't bump in lockstep with Kotlin/AGP — the build's expected JDK is
      # 21 regardless.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Provides $ANDROID_HOME with platform-tools + a baseline cmdline-tools.
      # The :app module's compileSdk = 37 will be downloaded on demand by AGP.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      - name: Upload unit-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
