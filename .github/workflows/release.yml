name: Release

# Manual-only — a deploy is never accidental. Pick a track (internal or
# production) and optionally promote internal → production with a 10 %
# staged rollout. Mirrors the local `fastlane deploy_internal` /
# `deploy_production` lanes exactly so behaviour is consistent between
# this runner and a developer's laptop.
on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play Store track to upload to"
        type: choice
        options:
          - internal
          - production
        default: internal
      promote:
        description: "Promote internal → production (10% rollout)"
        type: boolean
        default: false

# A second deploy queued behind the first would race against the Play
# Console's edit lock. Serialise instead.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build signed AAB + upload to Play Console
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Decode the keystore from the repo secret into a tmp file. Stays
      # under $RUNNER_TEMP so it never lands in the workspace and is
      # wiped when the job ends. The gradle build reads it via the
      # FASTLANE_GPSINFO_* env vars below.
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is empty"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          # Sanity: a real JKS is at least 1 KB. Catch empty / truncated
          # secrets here rather than mid-gradle-task.
          if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
            echo "::error::Decoded keystore is empty"; exit 1
          fi

      # The Play Console service account is one fat JSON blob. We write
      # it to disk and point `SUPPLY_JSON_KEY_FILE` at it — same pattern
      # the local script uses, so the Appfile resolves the same way.
      - name: Write Play service-account JSON
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON secret is empty"; exit 1
          fi
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-key.json"
          # Validate it's parseable JSON so we fail fast.
          python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$RUNNER_TEMP/play-key.json"

      # Run the same gradle path a developer runs locally before
      # uploading. Catches any regression that lint/unit-tests would.
      - name: Verify (unit tests + lint)
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace

      - name: Deploy
        env:
          # app/build.gradle.kts reads these directly when keystore.properties
          # is absent (which it is, on the runner).
          FASTLANE_GPSINFO_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          FASTLANE_GPSINFO_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FASTLANE_GPSINFO_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FASTLANE_GPSINFO_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # fastlane/Appfile resolves to this if set, otherwise falls
          # back to the gitignored repo-root path (which doesn't exist
          # on the runner).
          SUPPLY_JSON_KEY_FILE: ${{ runner.temp }}/play-key.json
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
          TRACK: ${{ inputs.track }}
          PROMOTE: ${{ inputs.promote }}
        run: |
          set -euo pipefail
          if [ "$PROMOTE" = "true" ]; then
            # Promote-only. The AAB is already on the internal track from a
            # previous run; re-uploading the same versionCode would fail
            # ("Version code N has already been used"). So skip the upload
            # and just promote what's already on internal → production.
            bundle exec fastlane deploy_production
          elif [ "$TRACK" = "production" ]; then
            # Fresh production release: build + push to internal, then
            # promote the build we just landed.
            bundle exec fastlane deploy_internal
            bundle exec fastlane deploy_production
          else
            bundle exec fastlane deploy_internal
          fi

      - name: Upload signed AAB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
          # 14 days is enough for a post-mortem on a failed deploy
          # without filling org storage with old bundles.
          retention-days: 14

      - name: Upload mapping file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
          retention-days: 90
