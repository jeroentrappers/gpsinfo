# GPSinfo tile-server knobs. Secret (tiles_api_key) lives in the gitignored
# secrets.yml (loaded via vars_files in site.yml) — this repo is public.
---
project: gpsinfo-tiles
app_dir: /opt/gpsinfo-tiles

tiles_domain: tiles.appmire.be
certbot_email: jeroen.trappers@secutec.com
enable_tls: true

# CORS allowlist (PCRE) — which browser origins may read the tiles cross-origin.
# The native app uses MapLibre Native, which ignores CORS, so only the web PWAs
# need listing; a non-matching origin gets no Access-Control-Allow-Origin header
# (the browser blocks the cross-origin read). The ?key= gate + rate-limit still
# bound non-browser clients. localhost is for `pnpm dev`.
tiles_cors_origin_regex: '^https://(charging|pluvio)\.appmire\.be$|^http://localhost(:[0-9]+)?$'

# Upstream open-source we derive from (OpenMapTiles schema). The live map
# styles, glyphs and sprite are mirrored from here once; the low-zoom
# `ne2_shaded` raster layer is left pointing at OpenFreeMap (tiny, cosmetic).
ofm_base: https://tiles.openfreemap.org
font_stacks:
  - "Noto Sans Regular"
  - "Noto Sans Bold"
  - "Noto Sans Italic"
sprite_dir: ofm_f384         # serves /sprites/ofm_f384/ofm{,@2x}.{json,png}
sprite_name: ofm

# Extract service (offline region cutter) — bound to loopback, fronted by nginx.
# 8081 (and the 80xx/810x range) are taken by other workloads on the box.
extract_port: 8791

# Planet build — throttled, since this runs on a box with live sites. Run via
# Java directly (NOT Docker — Docker can't bind-mount the sshfs Storage Box).
#   PBF + output stage on the 1 TB Storage Box (sequential, network-friendly);
#   the random-IO temp (node map / feature store) stays on local NVMe.
#   --nodemap-storage/--storage=mmap keeps RAM modest; nice/ionice + capped
#   threads keep the box polite. A disk watchdog aborts if local free drops low.
planetiler_jar: "{{ app_dir }}/planetiler.jar"
java_bin: /usr/lib/jvm/java-21-openjdk-amd64/bin/java
# Staged builds, in order — each swaps into the served file as it finishes, so
# coverage grows progressively. Geofabrik's "europe" already covers Benelux,
# Germany, France, UK + the rest of Europe, so the home->continent->global
# priority collapses to: belgium -> europe -> planet.
# (Full planet needs ~420 GB local temp; fits after the build-cache prune.)
planetiler_areas: "belgium europe planet"
# Push hard: 14 of 16 cores (leave 2 for system/IO). `nice -n 15` in the build
# script still makes it yield the moment a live site wants CPU, so this is
# "use all spare capacity" rather than "hog the box". Heap sized for the
# parallel feature-sort workers (~2 GB each).
build_threads: 14
build_xmx: "48g"
# Storage Box, mounted over CIFS (kernel mount; same ~90 MB/s as sshfs here,
# but no FUSE userspace overhead and Docker-bind-mountable). The subaccount is
# scoped to the gpsinfo-build folder, so its share root IS the build dir.
storagebox_share: //u614373-sub1.your-storagebox.de/u614373-sub1
storagebox_mount: /mnt/storagebox
# CIFS subaccount mounts its own root = the gpsinfo-build folder, so staging
# (PBF + output) lives directly at /mnt/storagebox; temp stays on local NVMe.
storagebox_build_dir: /mnt/storagebox                 # PBF + output (network, CIFS)
build_tmp_local: "{{ app_dir }}/buildtmp"             # random-IO temp (local NVMe)
build_min_free_gb: 450         # local headroom for the planet's ~420 GB temp
watchdog_min_free_gb: 25       # abort the build if local free drops below this

# ── Valhalla routing service (valhalla.appmire.be) ──────────────────────────
# Server-side Valhalla on the same box as the tiles (see
# docs/design/nav-engine-v2.md). The app calls it ONLINE for profile choice
# (fastest/shortest/economic) + alternatives + lane guidance + fast reroute;
# BRouter stays the offline fallback. Official gis-ops/docker-valhalla image —
# no native build; it builds its routing tiles from the OSM extracts below on
# first run and serves the HTTP API on loopback, fronted by nginx (TLS + ?key=).
valhalla_domain: valhalla.appmire.be
valhalla_app_dir: /opt/gpsinfo-valhalla
valhalla_image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
valhalla_port: 8002            # loopback only; nginx fronts it
# OSM extracts Valhalla builds routing tiles from. Benelux first (small, fast);
# add europe-latest later for wider coverage (much larger build).
valhalla_pbf_urls:
  - https://download.geofabrik.de/europe/belgium-latest.osm.pbf
  - https://download.geofabrik.de/europe/netherlands-latest.osm.pbf
  - https://download.geofabrik.de/europe/luxembourg-latest.osm.pbf
valhalla_threads: 6
# Reuse the tile server's API key gate (override in secrets.yml for a
# dedicated routing key).
valhalla_api_key: "{{ tiles_api_key }}"
