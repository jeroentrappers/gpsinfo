# The Hetzner Storage Box is retired (2026-11-19). /mnt/storagebox is now hetz1's local
# hot store, bind-mounted by appmire-infra (roles/hot-store), which also owns the
# mnt-storagebox.mount unit. This role only removes what GPSinfo used to install for the
# box and checks that the build staging path is mounted.
---
- name: Retire the old sshfs mount service if present
  ansible.builtin.systemd_service:
    name: gpsinfo-storagebox.service
    state: stopped
    enabled: false
  failed_when: false

- name: Remove the sshfs unit, the SMB credentials and the box SSH key
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/gpsinfo-storagebox.service
    - /etc/gpsinfo-tiles/smb.cred
    - /etc/gpsinfo-tiles/storagebox_ed25519
    - /etc/gpsinfo-tiles/storagebox_ed25519.pub

- name: Build staging is mounted (the appmire-infra hot store, not CIFS)
  ansible.builtin.shell: "findmnt -n -o FSTYPE {{ storagebox_mount }}"
  register: sb_fstype
  changed_when: false
  failed_when: sb_fstype.rc != 0 or (sb_fstype.stdout | trim) in ['cifs', 'smb3', 'fuse.sshfs']
