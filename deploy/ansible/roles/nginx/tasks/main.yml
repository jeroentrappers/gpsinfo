# Public reverse proxy + TLS for the tile server. Coexists with the box's other
# vhosts; manages only this site's files + its own cert. Run once DNS points at
# hetz1 (tiles.appmire.be is already linked).
---
- name: Ensure nginx + certbot present
  ansible.builtin.apt:
    name: [nginx, certbot, python3-certbot-nginx]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install rate-limit zones (http context)
  ansible.builtin.template:
    src: ratelimit.conf.j2
    dest: /etc/nginx/conf.d/10-gpsinfo-tiles-ratelimit.conf
    mode: "0644"
  notify: reload nginx

- name: Does a TLS cert already exist?
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ tiles_domain }}/fullchain.pem"
  register: tls_cert

- name: Render tile vhost
  ansible.builtin.template:
    src: tiles.conf.j2
    dest: "/etc/nginx/sites-available/{{ tiles_domain }}"
    mode: "0644"
  vars:
    have_cert: "{{ tls_cert.stat.exists }}"
  notify: reload nginx

- name: Enable tile vhost
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ tiles_domain }}"
    dest: "/etc/nginx/sites-enabled/{{ tiles_domain }}"
    state: link
  notify: reload nginx

- name: Apply nginx changes now (needed before certbot)
  ansible.builtin.meta: flush_handlers

- name: Obtain TLS cert
  when: enable_tls and not tls_cert.stat.exists
  ansible.builtin.command:
    cmd: >-
      certbot certonly --nginx --non-interactive --agree-tos -m {{ certbot_email }}
      -d {{ tiles_domain }}
  register: certbot_run
  changed_when: "'Congratulations' in certbot_run.stdout or 'Successfully received' in certbot_run.stdout"

- name: Re-render tile vhost with TLS
  when: enable_tls
  ansible.builtin.template:
    src: tiles.conf.j2
    dest: "/etc/nginx/sites-available/{{ tiles_domain }}"
    mode: "0644"
  vars:
    have_cert: true
  notify: reload nginx

