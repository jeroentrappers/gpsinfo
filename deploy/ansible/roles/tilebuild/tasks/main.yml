# Kick off the full-planet PMTiles build, THROTTLED for the shared box:
# PBF + output on the Storage Box, random-IO temp on local NVMe, capped CPU +
# low blk-IO + mmap storage + a JVM heap cap. Runs for hours, launched as a
# detached systemd transient unit (survives our SSH session, logs to the
# journal). A disk watchdog in the script aborts if local free drops too low.
---
- name: Skip if the planet tiles are already in place
  ansible.builtin.stat:
    path: "{{ app_dir }}/data/planet.pmtiles"
  register: planet_done

- name: Check the build isn't already running
  ansible.builtin.command: systemctl is-active gpsinfo-planet-build.service
  register: build_active
  changed_when: false
  failed_when: false

- name: Require the Storage Box to be mounted (PBF + output stage there)
  ansible.builtin.command: mountpoint -q /mnt/storagebox
  register: sb_mounted
  changed_when: false
  failed_when: false

- name: Fail if the Storage Box isn't mounted
  ansible.builtin.assert:
    that: "sb_mounted.rc == 0"
    fail_msg: "/mnt/storagebox is not mounted — start gpsinfo-storagebox.service first."
  when: not planet_done.stat.exists

- name: Local free space on {{ app_dir }} (KB)
  ansible.builtin.shell: "df -P {{ app_dir }} | awk 'NR==2{print $4}'"
  register: df_free
  changed_when: false

- name: "Refuse to build without ~{{ build_min_free_gb }} GB local free (for temp)"
  ansible.builtin.assert:
    that: "df_free.stdout | int > build_min_free_gb | int * 1024 * 1024"
    fail_msg: >-
      Only {{ (df_free.stdout | int / 1024 / 1024) | round(1) }} GB free on {{ app_dir }};
      need ~{{ build_min_free_gb }} GB local headroom for the planet build's temp.
  when: not planet_done.stat.exists

- name: Ensure local temp + Storage Box build dirs
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ build_tmp_local }}"
    - "{{ storagebox_build_dir }}"

- name: Stage the build script
  ansible.builtin.copy:
    src: run-planet-build.sh
    dest: "{{ app_dir }}/run-planet-build.sh"
    mode: "0755"

- name: Launch the staged build pipeline (detached)
  when:
    - not planet_done.stat.exists
    - build_active.stdout != "active"
  ansible.builtin.command:
    # argv form so AREAS ("belgium europe planet") survives as a single env var.
    argv:
      - systemd-run
      - --unit=gpsinfo-planet-build
      - --collect
      - "--setenv=JAVA={{ java_bin }}"
      - "--setenv=JAR={{ planetiler_jar }}"
      - "--setenv=AREAS={{ planetiler_areas }}"
      - "--setenv=THREADS={{ build_threads }}"
      - "--setenv=XMX={{ build_xmx }}"
      - "--setenv=STORAGE_BUILD_DIR={{ storagebox_build_dir }}"
      - "--setenv=LOCAL_TMP={{ build_tmp_local }}"
      - "--setenv=DATA_DIR={{ app_dir }}/data"
      - "--setenv=WATCHDOG_MIN_FREE_KB={{ watchdog_min_free_gb | int * 1024 * 1024 }}"
      - "{{ app_dir }}/run-planet-build.sh"
  changed_when: true

- name: Where to watch it
  ansible.builtin.debug:
    msg: >-
      Staged build launched ({{ planetiler_areas }}). Watch:
      journalctl -u gpsinfo-planet-build -f — each area swaps into
      {{ app_dir }}/data/planet.pmtiles as it finishes (coverage grows).
