# Deploy the GPSinfo vector-tile server to the shared appmire-hetz1 box.
#
#   cd deploy/ansible
#   ansible-playbook site.yml --tags app         # dirs, styles, fonts, sprites, extract container
#   ansible-playbook site.yml --tags nginx       # vhost + certbot TLS (once DNS points at hetz1)
#   ansible-playbook site.yml --tags storagebox  # CIFS mount of the Storage Box (build staging)
#   ansible-playbook site.yml --tags build       # kick off the throttled planet build (background)
#   ansible-playbook site.yml --tags valhalla     # Valhalla routing service (valhalla.appmire.be)
#
# The planet tiles take hours; everything else (styles/fonts/sprites/extract)
# comes up immediately, so tiles.appmire.be is live except map data until the
# build finishes. Valhalla likewise builds its routing tiles on first run
# (Benelux: minutes; europe: long) and serves once they're ready.
---
- name: GPSinfo vector tiles
  hosts: tiles
  vars_files:
    - secrets.yml
  roles:
    - role: app
      tags: [app]
    - role: valhalla        # server-side routing (valhalla.appmire.be)
      tags: [valhalla]
    - role: nginx
      become: true
      tags: [nginx]
    - role: storagebox       # CIFS mount of the Storage Box (build staging)
      become: true
      tags: [storagebox]
    - role: tilebuild        # role dir name avoids the repo's build/ gitignore
      become: true
      tags: [build, never]   # opt-in: only runs when --tags build is given
