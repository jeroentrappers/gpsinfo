# F-Droid anti-features. The app itself is fully libre and contains
# zero proprietary code or assets — the single declaration below is
# the honest call about Android Auto: the `androidx.car.app` library
# is Apache-2.0, but the AA host on the user's phone is proprietary
# Google software. The feature degrades silently to "unused" on
# de-Googled devices, so the rest of the app remains entirely
# usable.
AntiFeatures:
  NonFreeAddOn:
    en-US: >-
      Optional Android Auto integration uses the proprietary
      Android Auto host app on the phone to render its templates.
      The library itself is Apache 2.0; the app works fully
      without Android Auto installed (the integration sits
      dormant on de-Googled devices).

Builds:
  # Seed build at v2.0.0 — the first release that ships through
  # F-Droid. v1.0.0 was Play-Store-only and is intentionally not
  # listed here. F-Droid's AutoUpdateMode below will follow new
  # `vX.Y.Z` tags as they land on `main`.
  - versionName: 2.0.0
    versionCode: 2
    commit: v2.0.0
    subdir: app
    gradle:
      - yes

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 2.0.0
CurrentVersionCode: 2
