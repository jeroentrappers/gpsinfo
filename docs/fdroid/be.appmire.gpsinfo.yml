# Draft F-Droid metadata.
#
# This file is NOT consumed from this repo — F-Droid's build farm
# reads its own copy of this YAML out of
# https://gitlab.com/fdroid/fdroiddata/-/tree/master/metadata.
#
# To get GPSinfo into the F-Droid catalogue:
#   1. Fork fdroiddata on gitlab.com/fdroid/fdroiddata
#   2. Add this file at  metadata/be.appmire.gpsinfo.yml
#   3. Open a merge request and follow the maintainers' review.
#
# Keep this draft updated alongside any change to the build config
# (versionCode bumps, signing config, dependency licenses) so the
# next sync to fdroiddata is a one-shot copy.

